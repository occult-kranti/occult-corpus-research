<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 360px; font: 13px/1.45 system-ui, sans-serif; margin: 0; padding: 12px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    label { display: block; margin: 6px 0 2px; font-size: 12px; color: #555; }
    select, input[type=number] { width: 100%; box-sizing: border-box; padding: 5px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .btn { padding: 7px 10px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #3a6; color: #fff; }
    .btn-stop { background: #b44; color: #fff; }
    .btn-plain { background: #eee; }
    .muted { color: #777; font-size: 11px; }
    .warn { background: #fff5f5; border: 1px solid #e0b4b4; color: #7a2b2b; padding: 8px; border-radius: 6px; font-size: 12px; }
    .ok { color: #2a7; }
    #compliance { font-size: 11px; white-space: pre-wrap; max-height: 90px; overflow:auto; background:#fafafa; border-radius:6px; padding:6px; }
    #progress { font-size: 12px; }
    .check { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; font-size: 12px; }
    .check input { margin-top: 2px; }
  </style>
</head>
<body>
  <h1>Wizard Forums Scraper</h1>

  <div class="card">
    <b>Site policy check</b>
    <div id="compliance" class="muted">Checking robots.txt…</div>
    <div id="tdmWarn" class="warn" hidden></div>
    <label class="check" id="ackWrap" hidden>
      <input type="checkbox" id="ack" />
      <span>I have read the site's content-usage policy and will use the scraped data lawfully and in compliance with it (personal/authorized use; not for uses the site reserves).</span>
    </label>
  </div>

  <div class="card">
    <label>Scope</label>
    <select id="scope">
      <option value="current">Current page only</option>
      <option value="thread">This thread (all pages)</option>
      <option value="forum">This forum (all threads + pages)</option>
      <option value="board">Whole board (every forum)</option>
    </select>
    <div class="row">
      <div><label>Delay between requests (ms)</label><input type="number" id="delay" value="4000" min="1000" step="500" /></div>
      <div><label>Max pages per list (0 = all)</label><input type="number" id="maxPages" value="0" min="0" /></div>
    </div>
    <div class="row">
      <div><label>Max threads (0 = all)</label><input type="number" id="maxThreads" value="0" min="0" /></div>
      <div><label>Max requests (0 = all)</label><input type="number" id="maxReq" value="0" min="0" /></div>
    </div>
    <label class="check"><input type="checkbox" id="includePosts" checked /><span>Include full post content (visits each thread)</span></label>
  </div>

  <div class="row">
    <button id="start" class="btn btn-primary">Start</button>
    <button id="stop" class="btn btn-stop" hidden>Stop</button>
    <button id="selftest" class="btn btn-plain">Self-test page</button>
  </div>

  <div class="card" style="margin-top:10px;">
    <div id="progress" class="muted">Idle. Open a wizardforums.com page and pick a scope.</div>
  </div>

  <p class="muted">Runs in your logged-in tab using your own access, rate-limited. Exports stream to
    <b>Downloads/WizardForums/*.ndjson</b>. Keep the tab open while it runs.</p>
  <script src="popup.js"></script>
</body>
</html>
